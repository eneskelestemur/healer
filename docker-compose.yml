services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn healer.web.app:app --host 0.0.0.0 --port 8000 --reload --concurrency 4 --loglevel info
    environment:
      - HEALER_REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A healer.web.celery_worker.celery_app worker --loglevel=info
    environment:
      - HEALER_REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis

  frontend:
    build:
      context: ./web_client
      dockerfile: Dockerfile.dev
    volumes:
      - ./web_client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
