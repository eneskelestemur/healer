[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healer"
version = "0.1.0"
description = "Hit Expansion to Advanced Leads Using Enumerated Reactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Enes Kelestemur", email = "enesk@email.unc.com" }
]
requires-python = ">=3.11"
# dependencies = []

[project.scripts]
healer          = "healer.cli:main"
preprocess-bb   = "healer.scripts.preprocess_bb:main"

[tool.setuptools.packages.find]
where    = ["."]
include  = ["healer*"]          # only your healer package
exclude  = ["legacy*", "external*", "webserver*"]
