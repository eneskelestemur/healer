name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - run: ruff check --output-format=github .

      - run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,opt]"

      - name: Run tests
        run: pytest -v --tb=short --cov=healer --cov-report=term-missing

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Verify the packaged entry point works
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "
          from healer import MoleculeHEALER
          h = MoleculeHEALER(bb_source='test', reaction_tags='all',
                             sim_threshold=0.0, max_bbs_per_frag=5,
                             show_progress=False)
          h.set_query_mol('CC1(C)SC2C(NC(=O)Cc3ccccc3)C(=O)N2C1C(=O)O', n_compositions=2)
          h.enumerate(max_total_products=10)
          assert len(h.enumerated_molecules) > 1
          print('packaged entry point OK')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
