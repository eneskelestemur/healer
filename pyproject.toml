[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mol-healer"
version = "0.2.0"
description = "Hit Expansion to Advanced Leads Using Enumerated Reactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Enes Kelestemur", email = "enesk@email.unc.edu" }
]
keywords = ["chemistry", "drug-discovery", "hit-expansion", "enumeration", "retrosynthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
  "prop-profiler>=0.2.1",
  "numpy>=2.0",
  "pandas>=2.0",
  "tqdm>=4.62",
  "rdkit>=2024.6",
  "python-dotenv>=1.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "celery[redis]>=5.3",
]
opt = [
    "pygad>=3.0",
    "baybe[chem]>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
    "nbformat>=5.9",
    "nbconvert>=7.0",
]

[project.urls]
Homepage = "https://github.com/eneskelestemur/healer"
Repository = "https://github.com/eneskelestemur/healer"
Documentation = "https://github.com/eneskelestemur/healer/blob/main/docs/README.md"
Issues = "https://github.com/eneskelestemur/healer/issues"

[project.scripts]
healer        = "healer.cli:main"
healer-ui     = "healer.web.app:start"
preprocess-bb = "healer.scripts.preprocess_bb_source:cli"

[tool.setuptools.packages.find]
where   = ["."]
include = ["healer*"]
exclude = ["external*", "benchmark*", "notebooks*"]

[tool.setuptools.package-data]
healer = [
    "web/static/**/*",
    "data/reactions/reactions.json",
    "data/reactions/reaction_tags.txt",
    "data/buildingblocks/test_100_bb.sdf",
    "data/buildingblocks/test_100_bb_processed.sdf",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["external", "benchmark", "web_client", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = [
    "E501",    # long lines are reflowed by the formatter, not flagged by the linter
    "E741",    # single-letter names are idiomatic in the numeric code
    "B008",    # FastAPI relies on calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# The RDKit patch has to be applied before anything imports RDKit.
"healer/__init__.py" = ["E402"]
"healer/cli.py" = ["E402"]
"healer/web/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: benchmarks and timing-sensitive tests, deselected by default",
]
addopts = "-m 'not slow'"
